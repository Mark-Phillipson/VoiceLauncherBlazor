<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Desk Shift</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#16222b;--mute:#586a77;--line:#cbd6de;--accent:#0b6e8a;--good:#1b7a4b;--bad:#b3341f;--goodbg:#e2f3ea;--badbg:#fbe7e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--card:#1b262e;--ink:#e6eef3;--mute:#9db0bd;--line:#31434f;--accent:#4fc0de;--good:#5fd39a;--bad:#ff8d78;--goodbg:#173626;--badbg:#3c1f19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a20;--card:#1b262e;--ink:#e6eef3;--mute:#9db0bd;--line:#31434f;--accent:#4fc0de;--good:#5fd39a;--bad:#ff8d78;--goodbg:#173626;--badbg:#3c1f19;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--mute);margin-bottom:10px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ticket{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--accent);border-radius:6px;padding:18px}
.tmeta{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--mute);margin-bottom:8px}
.ticket h2{font-size:1.15rem;margin:0 0 8px}
.ticket p{margin:0 0 14px}
.opts{display:grid;gap:8px}
button.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
button.opt:hover:not(:disabled){border-color:var(--accent)}
button.opt:focus-visible,button.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.opt.right{background:var(--goodbg);border-color:var(--good)}
button.opt.wrong{background:var(--badbg);border-color:var(--bad)}
button.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:6px;font-size:.95rem}
.fb.ok{background:var(--goodbg)}.fb.no{background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
button.go{font:inherit;font-weight:600;margin-top:14px;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:11px 20px;cursor:pointer}
.big{font-size:3rem;font-weight:700;margin:6px 0;letter-spacing:-.02em}
.rev{margin:14px 0 0;padding:0;list-style:none;font-size:.92rem;color:var(--mute)}
.rev li{padding:6px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
<h1>Service Desk Shift</h1>
<p class="sub">Ten tickets are waiting. Pick the best next step for each one, then read why.</p>
<div class="bar"><span id="pos"></span><span id="sc"></span></div>
<div class="meter"><i id="m"></i></div>
<div id="stage"></div>
</main>
<script>
var T=[
{c:"Networking",t:"Printer is offline for the whole floor",d:"A user says nobody on floor 3 can print. Other network resources work. The printer shows a self-assigned 169.254.x.x address.",o:["Reinstall the print driver on every PC","Check the printer’s link to the DHCP server (cable, switch port, DHCP scope)","Replace the printer","Reboot all workstations"],a:1,e:"A 169.254.x.x address means the device asked for DHCP and got no answer. Everything else works, so the fault sits between the printer and the DHCP service, not in drivers."},
{c:"Security",t:"Email from the “CEO” asks for gift cards",d:"An employee forwards an urgent message from a lookalike address asking them to buy gift cards and send the codes.",o:["Reply asking if it’s real","Tell the employee to buy one card as a test","Treat it as phishing: report it, block the sender, warn staff","Delete it and say nothing"],a:2,e:"Urgency plus an unusual payment request from a lookalike domain is classic business email compromise. Reporting and blocking protects everyone; silent deletion leaves colleagues exposed."},
{c:"Troubleshooting",t:"Laptop is slow “since yesterday”",d:"One user’s laptop crawls. Task Manager shows disk at 100% and a recent Windows update finished last night.",o:["Wipe and reinstall the OS","Check disk health and what is using the disk before changing anything","Buy more RAM","Tell the user to wait a week"],a:1,e:"Diagnose first. Post-update indexing is often temporary, but a failing drive shows the same symptom. Checking SMART status and the top disk process separates the two cheaply."},
{c:"Security",t:"A new hire needs access to finance files",d:"A manager asks you to copy the permissions of a long-serving finance director onto the new analyst.",o:["Copy the director’s permissions exactly","Give the analyst admin rights to avoid repeat requests","Grant only what the analyst’s role needs, via a role-based group","Share the director’s password"],a:2,e:"Least privilege: copying a senior colleague’s access brings along rights the role doesn’t need. Role-based groups also make future audits and offboarding simple."},
{c:"Networking",t:"Website loads by IP address but not by name",d:"From a user’s PC, http://203.0.113.10 opens the site. http://intranet.example.com does not.",o:["Replace the network cable","Suspect DNS: check the configured DNS server and run nslookup","Reset the web server","Disable the firewall"],a:1,e:"If the IP works, connectivity and the web server are fine. Name resolution is failing, so DNS settings and lookups are the right place to start."},
{c:"Data",t:"Server disk is 95% full",d:"The file server’s data volume is nearly full. Backups last ran successfully last night.",o:["Delete the oldest files you find","Find what grew (disk usage report), confirm with owners, then archive or expand","Turn off backups to save space","Ignore it until it hits 100%"],a:1,e:"Know what’s growing before deleting anything. A usage report plus owner sign-off avoids removing live data, and a planned expansion beats an emergency at 100%."},
{c:"Security",t:"Employee lost their phone with email on it",d:"The phone has the company mail app and an authenticator app. It is not enrolled in device management.",o:["Wait to see if it turns up","Revoke sessions, reset the password, re-register MFA, and wipe if you can","Only change the email signature","Ask them to buy the same phone"],a:1,e:"Act as if the device is in someone else’s hands: cut off sessions, rotate credentials and re-establish MFA. Waiting gives an attacker time."},
{c:"Troubleshooting",t:"Wi‑Fi drops only in the meeting room",d:"Several users report drops in one room, always when it is full. Other areas are fine.",o:["Reboot the CEO’s laptop","Check access-point load, channel overlap and coverage in that room","Replace every access point in the building","Tell people to use cables"],a:1,e:"A pattern tied to place and crowd points to capacity or interference at that access point, so measure that spot before spending money elsewhere."},
{c:"Data",t:"Accidentally deleted spreadsheet, needed today",d:"A user deleted a shared file two hours ago. Versioning is on for the file share, and nightly backups exist.",o:["Restore from the share’s previous versions first","Rebuild it from memory","Restore the whole server from last month","Tell them it’s gone"],a:0,e:"Use the least disruptive, most recent recovery source first. Previous versions give the freshest copy in minutes without touching anyone else’s work."},
{c:"Networking",t:"Two PCs report a duplicate IP address",d:"Windows warns of an IP conflict. Both machines were set up manually last week.",o:["Switch both to DHCP (or reserve addresses) and remove the clash from static ranges","Give both the same address on purpose","Disable the network adapters permanently","Restart the router weekly"],a:0,e:"Hand-set addresses inside the DHCP range are the usual cause. Reservations or addresses outside the pool keep every device unique."}
];
var i=0,s=0,log=[],st=document.getElementById("stage");
function bar(){document.getElementById("pos").textContent="Ticket "+Math.min(i+1,T.length)+" of "+T.length;document.getElementById("sc").textContent="Score "+s;document.getElementById("m").style.width=(i/T.length*100)+"%"}
function show(){
bar();var q=T[i];
st.innerHTML='<div class="ticket"><div class="tmeta">#'+(4100+i)+' · '+q.c+'</div><h2></h2><p></p><div class="opts" id="o"></div><div id="f"></div></div>';
st.querySelector("h2").textContent=q.t;st.querySelector("p").textContent=q.d;
var o=document.getElementById("o");
q.o.forEach(function(x,k){var b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=function(){pick(k)};o.appendChild(b)});
}
function pick(k){
var q=T[i],ok=k===q.a,bs=document.querySelectorAll(".opt");
bs.forEach(function(b,n){b.disabled=true;if(n===q.a)b.classList.add("right");else if(n===k)b.classList.add("wrong")});
if(ok)s++;log.push({t:q.t,ok:ok});bar();
var f=document.getElementById("f");
f.innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Resolved.":"Not the best next step.")+'</b><span></span></div><button class="go" id="n"></button>';
f.querySelector("span").textContent=q.e;
var n=document.getElementById("n");n.textContent=i<T.length-1?"Next ticket":"Close shift";n.focus();
n.onclick=function(){i++;if(i<T.length)show();else end()};
}
function end(){
i=T.length;bar();
var r=s>=9?"Senior engineer material.":s>=7?"Solid shift. A few tickets to revisit.":s>=5?"Getting there. Review the explanations below.":"Tough shift. Run it again and read each explanation.";
st.innerHTML='<div class="ticket"><div class="tmeta">Shift report</div><div class="big">'+s+' / '+T.length+'</div><p>'+r+'</p><ul class="rev" id="rv"></ul><button class="go" id="again">Start another shift</button></div>';
var u=document.getElementById("rv");
log.forEach(function(l){var li=document.createElement("li");li.textContent=(l.ok?"Resolved: ":"Missed: ")+l.t;u.appendChild(li)});
document.getElementById("again").onclick=function(){i=0;s=0;log=[];show()};
}
show();
</script>
</body>
</html>
