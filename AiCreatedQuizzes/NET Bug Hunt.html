<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>.NET Bug Hunt</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f1eefb;
            --card: #fff;
            --ink: #1f1a33;
            --mute: #645d80;
            --line: #d8d2ee;
            --accent: #512bd4;
            --onacc: #fff;
            --code: #1f1a33;
            --codeink: #ece8ff;
            --hl: #ffd84d;
            --good: #17794a;
            --bad: #b42a3c;
            --goodbg: #e0f4ea;
            --badbg: #fde6e9;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #14111f;
                --card: #1e192e;
                --ink: #ece8ff;
                --mute: #a59fc4;
                --line: #352e52;
                --accent: #a28bff;
                --onacc: #14111f;
                --code: #0e0b18;
                --good: #6fd9a1;
                --bad: #ff8a9a;
                --goodbg: #143325;
                --badbg: #3d1a22;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #14111f;
            --card: #1e192e;
            --ink: #ece8ff;
            --mute: #a59fc4;
            --line: #352e52;
            --accent: #a28bff;
            --onacc: #14111f;
            --code: #0e0b18;
            --good: #6fd9a1;
            --bad: #ff8a9a;
            --goodbg: #143325;
            --badbg: #3d1a22;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.55 "DM Sans", system-ui, sans-serif
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px 40px
        }

        h1 {
            font-size: 1.7rem;
            margin: 0 0 4px;
            letter-spacing: -.02em
        }

        .sub {
            color: var(--mute);
            margin: 0 0 18px
        }

        .bar {
            display: flex;
            justify-content: space-between;
            font-size: .9rem;
            color: var(--mute);
            margin-bottom: 8px
        }

        .dots {
            display: flex;
            gap: 5px;
            margin-bottom: 16px
        }

        .dots i {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--line)
        }

        .dots i.ok {
            background: var(--good)
        }

        .dots i.no {
            background: var(--bad)
        }

        .dots i.cur {
            background: var(--accent)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 18px
        }

        .card h2 {
            font-size: 1.1rem;
            margin: 0 0 4px
        }

        .card p {
            margin: 0 0 12px;
            color: var(--mute)
        }

        pre {
            margin: 0 0 14px;
            background: var(--code);
            color: var(--codeink);
            border-radius: 8px;
            padding: 14px 0;
            overflow-x: auto;
            font: .86rem/1.6 "JetBrains Mono", ui-monospace, monospace;
            max-width: 100%
        }

        pre span {
            display: block;
            padding: 0 14px;
            white-space: pre;
            min-width: max-content
        }

        pre span.hl {
            background: rgba(255, 216, 77, .22);
            box-shadow: inset 3px 0 0 var(--hl)
        }

        .opts {
            display: grid;
            gap: 8px
        }

        button.opt {
            font: inherit;
            text-align: left;
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 11px 14px;
            cursor: pointer
        }

        button.opt:hover:not(:disabled) {
            border-color: var(--accent)
        }

        button.opt:focus-visible,
        button.go:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px
        }

        button.opt.right {
            background: var(--goodbg);
            border-color: var(--good)
        }

        button.opt.wrong {
            background: var(--badbg);
            border-color: var(--bad)
        }

        button.opt:disabled {
            cursor: default
        }

        .fb {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: .95rem
        }

        .fb.ok {
            background: var(--goodbg)
        }

        .fb.no {
            background: var(--badbg)
        }

        .fb b {
            display: block;
            margin-bottom: 2px
        }

        .fb code,
        .fix {
            font-family: "JetBrains Mono", monospace;
            font-size: .85rem
        }

        .fix {
            display: block;
            margin-top: 8px;
            white-space: pre-wrap
        }

        button.go {
            font: inherit;
            font-weight: 600;
            margin-top: 14px;
            background: var(--accent);
            color: var(--onacc);
            border: 0;
            border-radius: 8px;
            padding: 11px 20px;
            cursor: pointer
        }

        .big {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -.03em;
            margin: 4px 0
        }

        .rev {
            margin: 12px 0 0;
            padding: 0;
            list-style: none;
            font-size: .92rem;
            color: var(--mute)
        }

        .rev li {
            padding: 6px 0;
            border-top: 1px solid var(--line)
        }
    </style>
</head>

<body>
    <main>
        <h1>.NET Bug Hunt</h1>
        <p class="sub">Each C# snippet has one real-world problem. Find it, then see the fix.</p>
        <div class="bar"><span id="pos"></span><span id="sc"></span></div>
        <div class="dots" id="dots"></div>
        <div id="stage"></div>
    </main>
    <script>
        var Q = [
            {
                t: "The silent crash", d: "This runs from a button handler's helper.",
                c: ["public async void SaveAsync(Order o)", "{", "    await _repo.SaveAsync(o);", "    await _mail.SendAsync(o);", "}"], h: [0],
                o: ["Callers can't catch its exceptions, so it should return Task", "The second await needs ConfigureAwait(false) to be safe", "The repository field should be declared static to be shared", "The Order parameter should be a struct to avoid allocation"], a: 0,
                e: "async void methods can't be awaited, and exceptions thrown inside them go to the synchronization context and can crash the process. Reserve async void for event handlers.", f: "public async Task SaveAsync(Order o)"
            },
            {
                t: "Sockets that never come back", d: "A web API calls a partner service on every request.",
                c: ["public async Task<string> GetAsync(string url)", "{", "    using var client = new HttpClient();", "    return await client.GetStringAsync(url);", "}"], h: [2],
                o: ["Using var disposes too late, so it must be a using block", "A new client per call can exhaust sockets; use a factory", "GetStringAsync is obsolete and should be replaced by Send", "The url string should be a Uri so it is validated first"], a: 1,
                e: "Disposing an HttpClient doesn't release its sockets immediately, so a busy service can run out of ports. Use IHttpClientFactory or a shared instance.", f: "// inject IHttpClientFactory\nvar client = _factory.CreateClient();"
            },
            {
                t: "The frozen request", d: "A controller helper:",
                c: ["public Customer Load(int id)", "{", "    return _service.GetCustomerAsync(id).Result;", "}"], h: [2],
                o: ["Result is read-only, so the value is never actually returned", "Blocking on the task can deadlock; make the method async", "GetCustomerAsync should be static so it can run in parallel", "The return type should be nullable in case of a failed task"], a: 1,
                e: ".Result blocks the calling thread until the task finishes. In UI or legacy ASP.NET contexts it can deadlock, and in ASP.NET Core it wastes thread-pool threads.", f: "public async Task<Customer> LoadAsync(int id)\n    => await _service.GetCustomerAsync(id);"
            },
            {
                t: "Lost evidence", d: "Logging then rethrowing:",
                c: ["try { Process(); }", "catch (Exception ex)", "{", "    _log.LogError(ex, \"Failed\");", "    throw ex;", "}"], h: [4],
                o: ["LogError should come after the throw so it is not skipped", "throw ex resets the stack trace; a bare throw; keeps it", "Catching Exception is never allowed, only specific types", "Process should return a bool instead of throwing at all"], a: 1,
                e: "throw ex restarts the stack trace at this line, hiding where the error began. A bare throw; keeps the original trace.", f: "catch (Exception ex)\n{\n    _log.LogError(ex, \"Failed\");\n    throw;\n}"
            },
            {
                t: "The open door", d: "A search endpoint using ADO.NET:",
                c: ["var sql = \"SELECT * FROM Users WHERE Name = '\" + name + \"'\";", "var cmd = new SqlCommand(sql, conn);", "var reader = cmd.ExecuteReader();"], h: [0],
                o: ["SELECT * is not allowed with SqlCommand, list the columns", "Input is concatenated into the SQL, so use parameters instead", "ExecuteReader should be ExecuteScalar for a name lookup", "The connection should be static so it is opened only once"], a: 1,
                e: "Concatenating input lets an attacker change the query. Parameters keep data separate from SQL.", f: "var cmd = new SqlCommand(\n  \"SELECT * FROM Users WHERE Name = @name\", conn);\ncmd.Parameters.AddWithValue(\"@name\", name);"
            },
            {
                t: "Edit while looping", d: "Cleaning up expired sessions:",
                c: ["foreach (var s in _sessions)", "{", "    if (s.IsExpired)", "        _sessions.Remove(s);", "}"], h: [3],
                o: ["Remove only works on arrays, so List needs a different call", "Changing the list inside foreach throws InvalidOperationException", "IsExpired must be a method for the check to be evaluated", "foreach can't read a List, only arrays and dictionaries"], a: 1,
                e: "The enumerator detects the collection changed and throws. Collect first, or use a method built for this.", f: "_sessions.RemoveAll(s => s.IsExpired);"
            },
            {
                t: "The captive service", d: "Startup registration:",
                c: ["services.AddDbContext<AppDb>();           // scoped", "services.AddSingleton<ReportCache>();", "", "public ReportCache(AppDb db) { _db = db; }"], h: [1, 3],
                o: ["Singletons can't take constructor parameters of any kind", "A singleton capturing a scoped DbContext outlives each request", "AddDbContext must be registered after all singleton services", "ReportCache needs an interface before it can be registered"], a: 1,
                e: "This is a captive dependency: the scoped DbContext lives as long as the singleton, which is not thread-safe and can serve stale data. Inject IServiceScopeFactory or change the lifetime.", f: "services.AddScoped<ReportCache>();"
            },
            {
                t: "Leaky reader", d: "Reading a config file:",
                c: ["var reader = new StreamReader(path);", "var text = reader.ReadToEnd();", "return text.Trim();"], h: [0],
                o: ["ReadToEnd is only allowed on network streams, not files", "The reader is never disposed, so the file handle stays open", "Trim should happen first, before the text is fully read in", "The path should be a char array rather than a string value"], a: 1,
                e: "StreamReader holds an OS file handle. A using statement disposes it even if an exception occurs.", f: "using var reader = new StreamReader(path);"
            },
            {
                t: "Query runs twice", d: "A LINQ query over a database:",
                c: ["var active = db.Users.Where(u => u.IsActive);", "if (active.Any())", "    Console.WriteLine(active.Count());", "foreach (var u in active) Send(u);"], h: [1, 2, 3],
                o: ["Where must be called after Count for the filter to apply", "Each use re-runs the query against the database; call ToList()", "Any is always slower than Count, so Count should replace it", "Users should be an array so the filter runs in memory"], a: 1,
                e: "LINQ queries run each time they're enumerated. Three uses here mean three round trips, and results could change between them.", f: "var active = db.Users.Where(u => u.IsActive).ToList();"
            },
            {
                t: "Slow string building", d: "Building a large report:",
                c: ["string report = \"\";", "foreach (var line in lines)", "    report += line + \"\\n\";", "return report;"], h: [2],
                o: ["Strings can't be appended to in C#, only replaced by copy", "Each += allocates a new string, so use a StringBuilder", "foreach should be a for loop to avoid enumerator overhead", "The lines must be sorted first so appends stay in order"], a: 1,
                e: "Strings are immutable, so every += copies the whole text so far. For many appends, StringBuilder avoids the quadratic cost.", f: "var sb = new StringBuilder();\nforeach (var line in lines) sb.AppendLine(line);\nreturn sb.ToString();"
            }
        ];
        var cp = 0, i = 0, s = 0, log = [], st = document.getElementById("stage"), dots = document.getElementById("dots");
        function bar() {
            document.getElementById("pos").textContent = "Snippet " + Math.min(i + 1, Q.length) + " of " + Q.length; document.getElementById("sc").textContent = "Bugs found: " + s;
            dots.innerHTML = ""; Q.forEach(function (_, k) { var d = document.createElement("i"); if (k < log.length) d.className = log[k].ok ? "ok" : "no"; else if (k === i) d.className = "cur"; dots.appendChild(d) })
        }
        function show() {
            bar(); var q = Q[i];
            st.innerHTML = '<div class="card"><h2></h2><p></p><pre id="code"></pre><div class="opts" id="o"></div><div id="f"></div></div>';
            st.querySelector("h2").textContent = q.t; st.querySelector("p").textContent = q.d;
            var pre = document.getElementById("code");
            q.c.forEach(function (l, k) { var sp = document.createElement("span"); sp.textContent = l || " "; pre.appendChild(sp) });
            var o = document.getElementById("o");
            var ix = q.o.map(function (_, k) { return k }); for (var j = ix.length - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var t = ix[j]; ix[j] = ix[r]; ix[r] = t } cp = ix.indexOf(q.a);
            ix.forEach(function (orig, k) { var b = document.createElement("button"); b.className = "opt"; b.textContent = q.o[orig]; b.onclick = function () { pick(k) }; o.appendChild(b) });
        }
        function pick(k) {
            var q = Q[i], ok = k === cp;
            document.querySelectorAll(".opt").forEach(function (b, n) { b.disabled = true; if (n === cp) b.classList.add("right"); else if (n === k) b.classList.add("wrong") });
            document.querySelectorAll("#code span").forEach(function (sp, n) { if (q.h.indexOf(n) > -1) sp.classList.add("hl") });
            if (ok) s++; log.push({ t: q.t, ok: ok }); bar();
            var f = document.getElementById("f");
            f.innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '"><b>' + (ok ? "Bug found." : "Not quite.") + '</b><span id="ex"></span><span class="fix" id="fx"></span></div><button class="go" id="n"></button>';
            document.getElementById("ex").textContent = q.e; document.getElementById("fx").textContent = q.f;
            var n = document.getElementById("n"); n.textContent = i < Q.length - 1 ? "Next snippet" : "See results"; n.focus();
            n.onclick = function () { i++; if (i < Q.length) show(); else end() };
        }
        function end() {
            i = Q.length; bar();
            var r = s >= 9 ? "Excellent code reviewer." : s >= 7 ? "Strong. Revisit the ones you missed." : s >= 5 ? "Good start. The explanations are worth a second read." : "Run it again; each fix is a pattern worth remembering.";
            st.innerHTML = '<div class="card"><h2>Review complete</h2><div class="big">' + s + ' / ' + Q.length + '</div><p>' + r + '</p><ul class="rev" id="rv"></ul><button class="go" id="again">Play again</button></div>';
            var u = document.getElementById("rv");
            log.forEach(function (l) { var li = document.createElement("li"); li.textContent = (l.ok ? "Found: " : "Missed: ") + l.t; u.appendChild(li) });
            document.getElementById("again").onclick = function () { i = 0; s = 0; log = []; show() };
        }
        show();
    </script>
</body>

</html>
