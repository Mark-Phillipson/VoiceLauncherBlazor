<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talon File Workshop</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f7;--card:#fff;--ink:#192033;--mute:#5b6479;--line:#d0d7e6;--accent:#3552d6;--onacc:#fff;--ed:#161b27;--edink:#dfe5f3;--gut:#5d6a87;--good:#17794a;--bad:#b42a3c;--goodbg:#dff3e8;--badbg:#fde6e9;--add:#7fd99b;--del:#ff9aa8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131c;--card:#181e2b;--ink:#e6ebf7;--mute:#9aa5bf;--line:#2c3550;--accent:#8ea2ff;--onacc:#0f131c;--ed:#0a0d14;--good:#6fd9a1;--bad:#ff8a9a;--goodbg:#14332a;--badbg:#3d1a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f131c;--card:#181e2b;--ink:#e6ebf7;--mute:#9aa5bf;--line:#2c3550;--accent:#8ea2ff;--onacc:#0f131c;--ed:#0a0d14;--good:#6fd9a1;--bad:#ff8a9a;--goodbg:#14332a;--badbg:#3d1a22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Outfit",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute);margin-bottom:8px}
.dots{display:flex;gap:4px;margin-bottom:16px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h2{font-size:1.1rem;margin:0 0 4px}
.card p{margin:0 0 12px;color:var(--mute)}
.ed{margin:0 0 14px;background:var(--ed);color:var(--edink);border-radius:8px;overflow:hidden}
.ed .tab{font:500 .78rem "Source Code Pro",monospace;color:var(--gut);padding:6px 14px;border-bottom:1px solid #ffffff14}
.ed .body{padding:8px 0;overflow-x:auto;font:.9rem/1.7 "Source Code Pro",ui-monospace,monospace}
.ed .ln{display:block;white-space:pre;padding:0 14px;min-width:max-content}
.ed .ln b{display:inline-block;width:2ch;margin-right:12px;text-align:right;color:var(--gut);font-weight:400}
.ed .ln.add{background:#7fd99b24}.ed .ln.del{background:#ff9aa826}
.ed .ln.empty{color:var(--gut);font-style:italic}
.opts{display:grid;gap:8px}
button.opt{font:500 .9rem/1.6 "Source Code Pro",ui-monospace,monospace;white-space:pre;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;overflow-x:auto}
button.opt.txt{font:500 .95rem/1.4 "Outfit",system-ui,sans-serif;white-space:normal}
button.opt:hover:not(:disabled){border-color:var(--accent)}
button.opt:focus-visible,button.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.opt.right{background:var(--goodbg);border-color:var(--good)}
button.opt.wrong{background:var(--badbg);border-color:var(--bad)}
button.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--goodbg)}.fb.no{background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
button.go{font:inherit;font-weight:700;margin-top:14px;background:var(--accent);color:var(--onacc);border:0;border-radius:8px;padding:11px 20px;cursor:pointer}
.big{font-size:3rem;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.rev{margin:12px 0 0;padding:0;list-style:none;font-size:.92rem;color:var(--mute)}
.rev li{padding:6px 0;border-top:1px solid var(--line)}
.note{margin-top:16px;font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Talon File Workshop</h1>
<p class="sub">Edit .talon files like a pro. Pick the right line, then watch it land in the file.</p>
<div class="bar"><span id="pos"></span><span id="sc"></span></div>
<div class="dots" id="dots"></div>
<div id="stage"></div>
<p class="note">Examples follow the Talon docs. Check talonvoice.com/docs for newer syntax.</p>
</main>
<script>
/* f: existing file lines, n: file name, top: insert at top, raw: text answers with no file preview */
var Q=[
{t:"Where do commands start?",d:"This file has a context header, but Talon can’t tell where it ends and the commands begin. What is missing?",n:"chrome.talon",f:["app.name: Chrome","switch tab: key(ctrl-tab)"],ins:1,
o:["-","---","==","#"],a:0,
e:"A line holding just a dash separates the header from the commands. Without it, the header and commands blur together."},
{t:"Where does it live?",d:"You want to add your first voice command. Which file does Talon load as commands?",raw:1,
o:["hello.talon in your Talon user folder","hello.talon in your Downloads folder","hello.txt in your Talon user folder","hello.cmd in your Talon user folder"],a:0,
e:"Command files end in .talon and sit in the user folder, where Talon watches for changes. Anywhere else, or with another extension, they are ignored."},
{t:"Type a phrase",d:"Saying “good morning” should type Good morning! into the focused window.",n:"hello.talon",f:[],
o:["good morning: \"Good morning!\"","good morning = \"Good morning!\"","\"good morning\": Good morning!","good morning -> insert Good morning!"],a:0,
e:"A command is the spoken words, a colon, then the action. A quoted string alone is shorthand for insert()."},
{t:"Press it twice",d:"Add a command that presses Shift+Enter two times.",n:"editing.talon",f:[],
o:["double break: key(shift-enter:2)","double break: key(shift-enter x2)","double break: key(shift-enter, 2)","double break: key(shift-enter)*2"],a:0,
e:"Add a colon and a count after the key to repeat it, as in key(shift-enter:2)."},
{t:"Chain some actions",d:"Type hello, wait one second, then press Enter.",n:"greet.talon",f:[],
o:["send hello:\n    insert(\"hello\")\n    sleep(1)\n    key(enter)","send hello:\n    insert(\"hello\")\n    wait(1)\n    key(enter)","send hello:\n    key(enter)\n    sleep(1)\n    insert(\"hello\")","send hello:\n    insert(\"hello\")\n    sleep(1)\n    enter()"],a:0,
e:"Put each action on its own indented line, in the order they should run. sleep pauses in seconds, and key presses Enter."},
{t:"Two ways to say it",d:"“Tap” and “mouse click” should both left-click.",n:"mouse.talon",f:[],
o:["mouse click | tap: mouse_click(0)","mouse click, tap: mouse_click(0)","mouse click or tap: mouse_click(0)","[mouse click, tap]: mouse_click(0)"],a:0,
e:"A pipe separates alternative spoken forms for the same command."},
{t:"Polite but optional",d:"“Save file” should work with or without “please” in front.",n:"files.talon",f:[],
o:["[please] save file: key(ctrl-s)","(please) save file: key(ctrl-s)","please? save file: key(ctrl-s)","{please} save file: key(ctrl-s)"],a:0,
e:"Square brackets mark a word as optional. Round brackets only group words, so “please” would still be required."},
{t:"Only when alone",d:"The command test should only fire when it is the entire command chain, not when chained with other commands.",n:"anchors.talon",f:[],
o:["^test$: insert(\"Hello World!\")","^test: insert(\"Hello World!\")","test$: insert(\"Hello World!\")","$test^: insert(\"Hello World!\")"],a:0,
e:"^ anchors to the start of the chain and $ to the end. Using both means test must be the only thing said."},
{t:"Chrome only",d:"These commands should only be active when Chrome is the focused app. Add the header line.",n:"chrome.talon",f:["-","switch tab: key(ctrl-tab)"],top:1,
o:["app.name: Chrome","window: Chrome","app.exe == Chrome","if app is Chrome:"],a:0,
e:"Context headers use match lines like app.name: Chrome above the dash. They decide when the file is active."},
{t:"Rewire an action",d:"Make the built-in action app.tab_next press Ctrl+Tab in this app.",n:"chrome.talon",f:["app.name: Chrome","-"],
o:["action(app.tab_next): key(ctrl-tab)","app.tab_next: key(ctrl-tab)","override(app.tab_next): key(ctrl-tab)","def app.tab_next: key(ctrl-tab)"],a:0,
e:"action(name): implements or overrides an action for this file’s context, so shared commands work differently per app."},
{t:"Switch on a tag",d:"When this file’s context applies, also turn on the tag user.tabs.",n:"chrome.talon",f:["app.name: Chrome","-"],
o:["tag(): user.tabs","tag user.tabs","enable(user.tabs)","tags: user.tabs"],a:0,
e:"tag(): name activates a tag, which switches on any command files that require it."},
{t:"Dropped keys",d:"In one app, Talon’s key presses seem jumbled or dropped. What should you try?",raw:1,
o:["Raise key_wait inside a settings() block","Lower mouse_speed inside a tag() block","Rename the .talon file to start with zz","Put key(ctrl-tab) before every insert call"],a:0,
e:"key_wait sets the delay when pressing keys, and a settings() block in a context-specific file applies it only to that app."}
];
var cp=0,i=0,s=0,log=[],st=document.getElementById("stage"),dots=document.getElementById("dots");
function bar(){document.getElementById("pos").textContent="Task "+Math.min(i+1,Q.length)+" of "+Q.length;document.getElementById("sc").textContent="Correct: "+s;
dots.innerHTML="";Q.forEach(function(_,k){var d=document.createElement("i");if(k<log.length)d.className=log[k].ok?"ok":"no";else if(k===i)d.className="cur";dots.appendChild(d)})}
function file(q,add,cls){
var lines=[],n=0;
function L(x,c){n++;lines.push('<span class="ln'+(c?" "+c:"")+'"><b>'+n+'</b></span>');lines[lines.length-1]=[x,c,n]}
var base=q.f.slice(),extra=add?add.split("\n"):[];
var seq=[];
if(q.top)extra.forEach(function(x){seq.push([x,cls])});
base.forEach(function(x,k){seq.push([x,""]);if(!q.top&&q.ins&&k===0)extra.forEach(function(y){seq.push([y,cls])})});
if(!q.top&&!q.ins)extra.forEach(function(x){seq.push([x,cls])});
var wrap=document.createElement("div");wrap.className="ed";
var tab=document.createElement("div");tab.className="tab";tab.textContent=q.n;wrap.appendChild(tab);
var body=document.createElement("div");body.className="body";
if(!seq.length){var e=document.createElement("span");e.className="ln empty";e.textContent="(empty file)";body.appendChild(e)}
seq.forEach(function(r,k){var sp=document.createElement("span");sp.className="ln"+(r[1]?" "+r[1]:"");var b=document.createElement("b");b.textContent=k+1;sp.appendChild(b);sp.appendChild(document.createTextNode(r[0]));body.appendChild(sp)});
wrap.appendChild(body);return wrap}
function show(){
bar();var q=Q[i];
st.innerHTML='<div class="card"><h2></h2><p></p><div id="fw"></div><div class="opts" id="o"></div><div id="f"></div></div>';
st.querySelector("h2").textContent=q.t;st.querySelector("p").textContent=q.d;
if(!q.raw)document.getElementById("fw").appendChild(file(q,"",""));
var o=document.getElementById("o");
var ix=q.o.map(function(_,k){return k});for(var j=ix.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=ix[j];ix[j]=ix[r];ix[r]=t}cp=ix.indexOf(q.a);
ix.forEach(function(orig,k){var b=document.createElement("button");b.className="opt"+(q.raw?" txt":"");b.textContent=q.o[orig];b.onclick=function(){pick(k,orig)};o.appendChild(b)});
}
function pick(k,orig){
var q=Q[i],ok=k===cp;
document.querySelectorAll(".opt").forEach(function(b,n){b.disabled=true;if(n===cp)b.classList.add("right");else if(n===k)b.classList.add("wrong")});
if(!q.raw){var fw=document.getElementById("fw");fw.innerHTML="";fw.appendChild(file(q,q.o[orig],ok?"add":"del"))}
if(ok)s++;log.push({t:q.t,ok:ok});bar();
var f=document.getElementById("f");
f.innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Saved. Talon reloaded it.":"That line won\u2019t work here.")+'</b><span id="ex"></span></div><button class="go" id="n"></button>';
document.getElementById("ex").textContent=q.e;
var n=document.getElementById("n");n.textContent=i<Q.length-1?"Next task":"See results";n.focus();
n.onclick=function(){i++;if(i<Q.length)show();else end()};
}
function end(){
i=Q.length;bar();
var r=s>=11?"Ready to customise Talon.":s>=8?"Solid. Revisit the ones you missed.":s>=5?"Good start. Try the examples in a real .talon file.":"Run it again, then try each example in a real file.";
st.innerHTML='<div class="card"><h2>Workshop complete</h2><div class="big">'+s+' / '+Q.length+'</div><p>'+r+'</p><ul class="rev" id="rv"></ul><button class="go" id="again">Play again</button></div>';
var u=document.getElementById("rv");
log.forEach(function(l){var li=document.createElement("li");li.textContent=(l.ok?"Correct: ":"Missed: ")+l.t;u.appendChild(li)});
document.getElementById("again").onclick=function(){i=0;s=0;log=[];show()};
}
show();
</script>
</body>
</html>
