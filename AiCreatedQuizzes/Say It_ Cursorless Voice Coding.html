<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Say It: Cursorless Voice Coding</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #e8f0ec;
            --card: #fff;
            --ink: #15251f;
            --mute: #586b63;
            --line: #c5d5cc;
            --accent: #0f766e;
            --onacc: #fff;
            --code: #17211d;
            --codeink: #e7f1ec;
            --good: #17794a;
            --bad: #b42a3c;
            --goodbg: #dff3e8;
            --badbg: #fde6e9;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1815;
                --card: #18241f;
                --ink: #e7f1ec;
                --mute: #9db3a9;
                --line: #2c3f37;
                --accent: #4fd1c0;
                --onacc: #0f1815;
                --code: #0a110e;
                --good: #6fd9a1;
                --bad: #ff8a9a;
                --goodbg: #14332a;
                --badbg: #3d1a22;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1815;
            --card: #18241f;
            --ink: #e7f1ec;
            --mute: #9db3a9;
            --line: #2c3f37;
            --accent: #4fd1c0;
            --onacc: #0f1815;
            --code: #0a110e;
            --good: #6fd9a1;
            --bad: #ff8a9a;
            --goodbg: #14332a;
            --badbg: #3d1a22;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.55 "Manrope", system-ui, sans-serif
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 16px 40px
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            margin: 0 0 4px;
            letter-spacing: -.02em
        }

        .sub {
            color: var(--mute);
            margin: 0 0 16px
        }

        .bar {
            display: flex;
            justify-content: space-between;
            font-size: .9rem;
            color: var(--mute);
            margin-bottom: 8px
        }

        .dots {
            display: flex;
            gap: 4px;
            margin-bottom: 16px
        }

        .dots i {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--line)
        }

        .dots i.ok {
            background: var(--good)
        }

        .dots i.no {
            background: var(--bad)
        }

        .dots i.cur {
            background: var(--accent)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 18px
        }

        .card h2 {
            font-size: 1.1rem;
            margin: 0 0 4px
        }

        .card p {
            margin: 0 0 12px;
            color: var(--mute)
        }

        pre {
            margin: 0 0 14px;
            background: var(--code);
            color: var(--codeink);
            border-radius: 8px;
            padding: 10px 0;
            overflow-x: auto;
            font: .95rem/2.3 "Fira Code", ui-monospace, monospace;
            max-width: 100%
        }

        pre div {
            padding: 0 16px;
            white-space: pre;
            min-width: max-content
        }

        .h {
            position: relative;
            display: inline-block;
            font-weight: 500
        }

        .h::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -.06em;
            width: .62em;
            height: .3em;
            transform: translateX(-50%);
            background: var(--c);
            border-radius: 50%/65% 65% 35% 35%
        }

        .h.fox::before {
            border-radius: 0;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            height: .38em;
            top: -.055em
        }

        .opts {
            display: grid;
            gap: 8px
        }

        button.opt {
            font: 500 .95rem "Fira Code", ui-monospace, monospace;
            text-align: left;
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer
        }

        button.opt:hover:not(:disabled) {
            border-color: var(--accent)
        }

        button.opt:focus-visible,
        button.go:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px
        }

        button.opt.right {
            background: var(--goodbg);
            border-color: var(--good)
        }

        button.opt.wrong {
            background: var(--badbg);
            border-color: var(--bad)
        }

        button.opt:disabled {
            cursor: default
        }

        .fb {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: .95rem
        }

        .fb.ok {
            background: var(--goodbg)
        }

        .fb.no {
            background: var(--badbg)
        }

        .fb b {
            display: block;
            margin-bottom: 2px
        }

        button.go {
            font: inherit;
            font-weight: 700;
            margin-top: 14px;
            background: var(--accent);
            color: var(--onacc);
            border: 0;
            border-radius: 8px;
            padding: 11px 20px;
            cursor: pointer
        }

        .big {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -.03em;
            margin: 4px 0
        }

        .rev {
            margin: 12px 0 0;
            padding: 0;
            list-style: none;
            font-size: .92rem;
            color: var(--mute)
        }

        .rev li {
            padding: 6px 0;
            border-top: 1px solid var(--line)
        }

        .note {
            margin-top: 16px;
            font-size: .85rem;
            color: var(--mute)
        }
    </style>
</head>

<body>
    <main>
        <h1>Say It: Cursorless Voice Coding</h1>
        <p class="sub">Read the hats in the code, then pick the spoken command that does the job.</p>
        <div class="bar"><span id="pos"></span><span id="sc"></span></div>
        <div class="dots" id="dots"></div>
        <div id="stage"></div>
        <p class="note">Spoken forms can be customised. Say “cursorless help” in VS Code to see the ones on your setup.
        </p>
    </main>
    <script>
        var G = "#8a929c", B = "#3b82f6";
        /* seg: [text, hatIndex, color, shape] */
        var Q = [
            {
                t: "Alphabet check", d: "A gray hat sits over the g. Delete that token.",
                c: [[["gap", 0, G], [" = 8"]]],
                o: ["chuck gust", "chuck gap", "chuck gas", "chuck gate"], a: 0,
                e: "Hats sit on a letter, and you say that letter in the Talon alphabet (g is “gust”). “Chuck” removes the target and tidies up around it."
            },
            {
                t: "Same letter, different color", d: "Select tax. Both total and tax have a hat on t.",
                c: [[["total", 0, G], [" = "], ["price", 0, G], [" + "], ["tax", 0, B]]],
                o: ["take blue trap", "take trap", "take blue pit", "take red trap"], a: 0,
                e: "The blue hat marks tax, so say the color first, then the letter. Gray is the default hat, so “take trap” would pick total."
            },
            {
                t: "Whole line", d: "Delete the entire line that contains fee.",
                c: [[["def pay(order):"]], [["    "], ["fee", 0, G], [" = order.rate"]]],
                o: ["chuck line fine", "chuck fine", "clear line fine", "take line fine"], a: 0,
                e: "“Line” widens the target to the whole line, and “chuck” removes it cleanly without leaving a blank line. “Take” only selects."
            },
            {
                t: "Which function?", d: "Your cursor is inside save(). Delete the whole function, then dictate the letter a.",
                c: [[["def save(user):"]], [["    db.add(user)|"]]],
                o: ["chuck funk this", "chuck funk air", "chuck funk", "chuck function"], a: 0,
                e: "If you omit the mark, a following letter is read as a hat (“funk air”). Saying “this” explicitly ends the command, so “air” is typed afterwards."
            },
            {
                t: "A span of tokens", d: "Select from width through height, including the comma between them.",
                c: [[["compute("], ["width", 0, G], [", "], ["height", 0, G], [")"]]],
                o: ["take whale past harp", "take whale and harp", "take whale with harp", "take whale to harp"], a: 0,
                e: "“Past” makes a range from the first target to the second. “And” would give two separate selections instead."
            },
            {
                t: "Copy, don’t cut", d: "Your cursor is on the empty line below. Insert a copy of hours there and leave the original where it is.",
                c: [[["total = "], ["rate", 0, G], [" * "], ["hours", 0, G]], [["|"]]],
                o: ["bring harp", "move harp", "chuck harp", "pre harp"], a: 0,
                e: "“Bring” copies the target to the cursor. “Move” would take hours out of its original place."
            },
            {
                t: "Trade places", d: "Swap the host and port arguments.",
                c: [[["connect("], ["host", 0, G], [", "], ["port", 0, G], [")"]]],
                o: ["swap harp with pit", "bring harp to pit", "move harp to pit", "take harp with pit"], a: 0,
                e: "“Swap X with Y” exchanges two targets in one command. “Bring” would overwrite port with a copy, and “move” would delete host."
            },
            {
                t: "Multi-line statement", d: "Delete the whole statement that contains price, not just its line.",
                c: [[["total = add("]], [["    "], ["price", 0, G], [","]], [["    tax)"]]],
                o: ["chuck state pit", "chuck line pit", "chuck token pit", "chuck funk pit"], a: 0,
                e: "“State” means statement, so it covers all three lines. “Line” would remove only the middle one and break the call."
            },
            {
                t: "Cursor placement", d: "Put the cursor right after name so you can type.",
                c: [[["name", 0, G], [" = \"Ada\""]]],
                o: ["post near", "pre near", "take near", "bring near"], a: 0,
                e: "“Post” places the cursor after the target and “pre” places it before. The n is “near” in the alphabet."
            },
            {
                t: "Shapes", d: "The buffer token wears a fox-shaped hat in the default color. Select it.",
                c: [[["buffer", 0, G, "fox"], [".flush()"]]],
                o: ["take fox bat", "take bat fox", "take blue bat", "take fox buffer"], a: 0,
                e: "Shape comes first, then the letter: “take fox bat”. Shapes give extra hats for tokens that start with the same letter."
            },
            {
                t: "Lost your place?", d: "You forgot a spoken form. What do you say to open the Cursorless cheatsheet?",
                c: [],
                o: ["cursorless help", "show all hats", "hat help list", "cursorless hats"], a: 0,
                e: "“Cursorless help” opens the cheatsheet, which lists the spoken forms for your own setup, including any you have customised."
            }
        ];
        var cp = 0, i = 0, s = 0, log = [], st = document.getElementById("stage"), dots = document.getElementById("dots");
        function bar() {
            document.getElementById("pos").textContent = "Challenge " + Math.min(i + 1, Q.length) + " of " + Q.length; document.getElementById("sc").textContent = "Correct: " + s;
            dots.innerHTML = ""; Q.forEach(function (_, k) { var d = document.createElement("i"); if (k < log.length) d.className = log[k].ok ? "ok" : "no"; else if (k === i) d.className = "cur"; dots.appendChild(d) })
        }
        function show() {
            bar(); var q = Q[i];
            st.innerHTML = '<div class="card"><h2></h2><p></p><div id="cw"></div><div class="opts" id="o"></div><div id="f"></div></div>';
            st.querySelector("h2").textContent = q.t; st.querySelector("p").textContent = q.d;
            if (q.c.length) {
                var pre = document.createElement("pre");
                q.c.forEach(function (line) {
                    var dv = document.createElement("div");
                    line.forEach(function (sg) {
                        var tx = sg[0];
                        if (sg.length > 1 && sg[1] >= 0) {
                            var a = document.createTextNode(tx.slice(0, sg[1])), h = document.createElement("span"); h.className = "h" + (sg[3] ? " " + sg[3] : ""); h.style.setProperty("--c", sg[2]); h.textContent = tx.charAt(sg[1]);
                            dv.appendChild(a); dv.appendChild(h); dv.appendChild(document.createTextNode(tx.slice(sg[1] + 1)))
                        }
                        else dv.appendChild(document.createTextNode(tx))
                    });
                    pre.appendChild(dv)
                });
                document.getElementById("cw").appendChild(pre)
            }
            var o = document.getElementById("o");
            var ix = q.o.map(function (_, k) { return k }); for (var j = ix.length - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var t = ix[j]; ix[j] = ix[r]; ix[r] = t } cp = ix.indexOf(q.a);
            ix.forEach(function (orig, k) { var b = document.createElement("button"); b.className = "opt"; b.textContent = "\u201C" + q.o[orig] + "\u201D"; b.onclick = function () { pick(k) }; o.appendChild(b) });
        }
        function pick(k) {
            var q = Q[i], ok = k === cp;
            document.querySelectorAll(".opt").forEach(function (b, n) { b.disabled = true; if (n === cp) b.classList.add("right"); else if (n === k) b.classList.add("wrong") });
            if (ok) s++; log.push({ t: q.t, ok: ok }); bar();
            var f = document.getElementById("f");
            f.innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '"><b>' + (ok ? "Heard loud and clear." : "Talon didn\u2019t do what you meant.") + '</b><span id="ex"></span></div><button class="go" id="n"></button>';
            document.getElementById("ex").textContent = q.e;
            var n = document.getElementById("n"); n.textContent = i < Q.length - 1 ? "Next challenge" : "See results"; n.focus();
            n.onclick = function () { i++; if (i < Q.length) show(); else end() };
        }
        function end() {
            i = Q.length; bar();
            var r = s >= 10 ? "Hands-free ready." : s >= 8 ? "Strong. Practise the ones you missed out loud." : s >= 5 ? "Good start. Try the commands in a real file next." : "Run it again, then keep the cheatsheet open while you practise.";
            st.innerHTML = '<div class="card"><h2>Session complete</h2><div class="big">' + s + ' / ' + Q.length + '</div><p>' + r + '</p><ul class="rev" id="rv"></ul><button class="go" id="again">Play again</button></div>';
            var u = document.getElementById("rv");
            log.forEach(function (l) { var li = document.createElement("li"); li.textContent = (l.ok ? "Correct: " : "Missed: ") + l.t; u.appendChild(li) });
            document.getElementById("again").onclick = function () { i = 0; s = 0; log = []; show() };
        }
        show();
    </script>
</body>

</html>
